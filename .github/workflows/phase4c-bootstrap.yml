name: Phase 4C bootstrap validation

on:
  push:
    branches:
      - phase4c-prepared-response-reuse

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Phase 4C implementation
        run: |
          python .phase4c_apply.py
          python .phase4c_hotfix.py
          git diff --check

      - name: Compile changed Python
        run: |
          python -m py_compile \
            shuo/services/llm.py \
            shuo/agent.py \
            shuo/bluetooth/speculative.py \
            shuo/bluetooth/conversation.py \
            shuo/bluetooth/production.py \
            scripts/run_bluetooth_ai.py \
            tests/test_bluetooth_phase4c.py

      - name: Focused Phase 4 regression
        run: |
          python -m pytest -q \
            tests/test_bluetooth_phase4c.py \
            tests/test_bluetooth_speculative.py \
            tests/test_bluetooth_conversation.py \
            tests/test_bluetooth_production.py \
            tests/test_flux.py \
            tests/test_tts_failure.py \
            tests/test_player.py \
            tests/test_update.py \
            -p no:cacheprovider

      - name: Bluetooth regression
        run: ./scripts/dev/04_test_bluetooth.sh

      - name: Full regression with documented baseline comparison
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider > /tmp/full-pytest.log 2>&1
          rc=$?
          set -e
          cat /tmp/full-pytest.log
          if [[ $rc -eq 0 ]]; then
            echo "Full suite is completely green."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path('/tmp/full-pytest.log').read_text()
          failed = []
          for line in text.splitlines():
              if line.startswith('FAILED '):
                  failed.append(line[len('FAILED '):].split(' - ', 1)[0].strip())

          expected = {
              'scripts/test_v2_keys.py::test_shunya_key',
              'scripts/test_v2_keys.py::test_azure_key',
              'tests/test_config_api.py::TestIsolation::test_the_call_server_has_no_config_routes',
              'tests/test_test_call.py::TestTheProcessSplitSurvives::test_the_call_server_has_no_test_call_routes',
          }
          if set(failed) != expected:
              print('Unexpected full-suite failures:', failed, file=sys.stderr)
              sys.exit(1)
          if text.count('async def functions are not natively supported') < 2:
              print('Shunya/Azure failure signature changed', file=sys.stderr)
              sys.exit(1)
          if "_IncludedRouter' object has no attribute 'path'" not in text:
              print('Config/test-call failure signature changed', file=sys.stderr)
              sys.exit(1)
          print('Full regression matches the documented four-failure baseline by identity/signature.')
          PY

      - name: Final diff validation
        run: git diff --check

      - name: Commit verified implementation
        run: |
          rm -f .phase4c.patch .phase4c-fix.patch .phase4c_apply.py .phase4c_hotfix.py .github/workflows/phase4c-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(bluetooth): add Phase 4C prepared response reuse"
          git push origin HEAD:phase4c-prepared-response-reuse
