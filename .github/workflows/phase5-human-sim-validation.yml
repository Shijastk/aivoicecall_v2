name: Phase 5 human-sim benchmark validation

on:
  push:
    branches:
      - feat/phase5-human-sim-benchmark

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pocket profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pocket-tts.txt

      - name: Compile changed Python
        run: |
          python -m py_compile             scripts/dev/15_conversation_benchmark.py             shuo/benchmark/conversation.py             shuo/benchmark/human_sim.py             tests/test_conversation_benchmark.py

      - name: CLI smoke
        run: |
          python scripts/dev/15_conversation_benchmark.py human-sim --help
          python scripts/dev/15_conversation_benchmark.py providers --help

      - name: Focused benchmark regression
        run: |
          python -m pytest -q             tests/test_conversation_benchmark.py             tests/test_tts_pocket.py             tests/test_tts_provider.py             tests/test_bluetooth_conversation.py             tests/test_bluetooth_production.py             tests/test_player.py             -p no:cacheprovider

      - name: Offline orchestration benchmark smoke
        run: |
          PYTHONPATH=. python scripts/dev/15_conversation_benchmark.py offline             --json-out /tmp/human-sim-offline-smoke.json

      - name: Bluetooth full regression
        run: python -m pytest -q tests/test_bluetooth_*.py -p no:cacheprovider

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Full repository regression and exact baseline verification
        shell: bash
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider 2>&1 | tee /tmp/full-regression.log
          pytest_status=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/full-regression.log').read_text(
              encoding='utf-8', errors='replace'
          )
          expected = {
              'scripts/test_v2_keys.py::test_shunya_key',
              'scripts/test_v2_keys.py::test_azure_key',
              'tests/test_config_api.py::TestIsolation::test_the_call_server_has_no_config_routes',
              'tests/test_test_call.py::TestTheProcessSplitSurvives::test_the_call_server_has_no_test_call_routes',
          }
          observed = set(re.findall(r'^FAILED\s+([^\s]+)', text, re.MULTILINE))
          assert observed == expected, (sorted(expected), sorted(observed))
          assert 'async def functions are not natively supported' in text
          assert text.count("'_IncludedRouter' object has no attribute 'path'") >= 2
          print('FULL_SUITE_BASELINE_CLEAN')
          PY

          if [ "$pytest_status" -eq 0 ]; then
            echo "Full suite unexpectedly returned zero; baseline expectations changed"
            exit 1
          fi
