name: Phase 5 Android cellular closed-loop validation

on:
  push:
    branches:
      - feat/phase5-adb-cellular-closed-loop
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            python -m pip install "audioop-lts==0.2.2"
          fi

      - name: Compile changed Python
        run: |
          python -m py_compile \
            shuo/benchmark/android_cellular_loop.py \
            scripts/dev/18_android_cellular_closed_loop.py \
            tests/test_android_cellular_loop.py

      - name: CLI smoke
        env:
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH=. python scripts/dev/18_android_cellular_closed_loop.py --help >/tmp/loop-help.txt
          grep -q "allow-provider-network" /tmp/loop-help.txt
          grep -q "CALL" /tmp/loop-help.txt || true

      - name: Focused closed-loop and Android transport tests
        env:
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q \
            tests/test_android_cellular_loop.py \
            tests/test_android_cellular_rx.py \
            tests/test_android_cellular_tx.py \
            tests/test_bluetooth_codec.py \
            -p no:cacheprovider

      - name: Bluetooth regression
        env:
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./scripts/dev/04_test_bluetooth.sh

      - name: Full suite with historical baseline verification
        env:
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider --junitxml=/tmp/full.xml
          pytest_code=$?
          set -e

          python - <<'PY'
          import xml.etree.ElementTree as ET

          expected = {
              ("scripts.test_v2_keys", "test_shunya_key"):
                  "async def functions are not natively supported",
              ("scripts.test_v2_keys", "test_azure_key"):
                  "async def functions are not natively supported",
              ("tests.test_config_api.TestIsolation",
               "test_the_call_server_has_no_config_routes"):
                  "_IncludedRouter",
              ("tests.test_test_call.TestTheProcessSplitSurvives",
               "test_the_call_server_has_no_test_call_routes"):
                  "_IncludedRouter",
          }

          root = ET.parse("/tmp/full.xml").getroot()
          observed = {}
          for case in root.iter("testcase"):
              failure = case.find("failure")
              error = case.find("error")
              node = failure if failure is not None else error
              if node is None:
                  continue
              key = (
                  case.attrib.get("classname", ""),
                  case.attrib.get("name", ""),
              )
              observed[key] = (
                  node.attrib.get("message", "") + "\n" + (node.text or "")
              )

          if set(observed) != set(expected):
              raise SystemExit(
                  "failure identity mismatch: "
                  f"expected={sorted(expected)} observed={sorted(observed)}"
              )
          for key, signature in expected.items():
              if signature not in observed[key]:
                  raise SystemExit(
                      f"failure signature mismatch for {key}: {signature!r}"
                  )

          print("FULL_SUITE_BASELINE_CLEAN")
          PY

          test "$pytest_code" -eq 1

      - name: Diff validation
        run: git diff --check origin/main...HEAD
